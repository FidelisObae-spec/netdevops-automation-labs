name: NetDevOps checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt flake8
      - name: Lint Python
        run: flake8 python-scripts tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
